<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dietas & Receitas</title>

  <!-- Fonte estilo HQ -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Bangers', sans-serif;
      background-image: url('xmen-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      color: #ffdd00;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 20px;
      background: rgba(0,0,0,0.8);
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffdd00;
      text-shadow: 3px 3px 6px black;
      font-size: 2em;
    }

    form {
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffdd00;
    }

    textarea, textarea.edit-textarea {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border-radius: 10px;
      border: 1px solid #ffdd00;
      background: rgba(255,255,255,0.9);
      color: #222;
      resize: vertical;
    }

    button, .btn {
      background: #ff4444;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 0.9em;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
      margin-left: 5px;
    }

    button:hover, .btn:hover {
      background: #cc0000;
      transform: scale(1.05);
    }

    button.cancelar, .btn.cancelar {
      background-color: #757575;
    }

    button.cancelar:hover, .btn.cancelar:hover {
      background-color: #424242;
    }

    .lista-dietas {
      list-style-type: none;
      padding: 0;
    }

    .lista-dietas li {
      background: rgba(255,255,255,0.15);
      color: #222;
      margin-bottom: 12px;
      padding: 12px 15px;
      border-radius: 10px;
      position: relative;
      white-space: pre-wrap;
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .lista-dietas li:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.03);
    }

    .actions {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #ffdd00;
      font-weight: bold;
      text-shadow: 2px 2px 5px black;
      font-size: 1.1em;
      transition: transform 0.2s ease;
    }

    .voltar:hover {
      text-decoration: underline;
      transform: scale(1.05);
    }

    @media(max-width: 400px) {
      h2 { font-size: 1.5em; }
      .lista-dietas li { font-size: 1em; padding: 10px; }
      .voltar { font-size: 1em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🍽️ Dietas & Receitas</h2>

    <form id="form-dieta">
      <label for="novaDieta">Adicione uma nova dieta ou receita:</label>
      <textarea id="novaDieta" placeholder="Digite sua dieta ou receita aqui..." required></textarea>
      <button type="submit">Salvar</button>
    </form>

    <ul class="lista-dietas" id="listaDietas"></ul>

    <a href="observacoes.html" class="voltar">⬅ Voltar para Observações</a><br/>
    <a href="index.html" class="voltar">⬅ Voltar para Página Inicial</a>
  </div>

  <script>
    const form = document.getElementById('form-dieta');
    const textarea = document.getElementById('novaDieta');
    const listaDietas = document.getElementById('listaDietas');

    function carregarDietas() {
      const dietas = JSON.parse(localStorage.getItem('dietas')) || [];
      listaDietas.innerHTML = '';

      dietas.forEach((dieta, index) => {
        const li = document.createElement('li');
        const textoDiv = document.createElement('div');
        textoDiv.textContent = dieta;
        textoDiv.style.whiteSpace = 'pre-wrap';

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';

        const btnEditar = document.createElement('button');
        btnEditar.textContent = 'Editar';
        btnEditar.className = 'btn';
        btnEditar.onclick = () => iniciarEdicao(index, li, textoDiv);

        const btnApagar = document.createElement('button');
        btnApagar.textContent = 'Apagar';
        btnApagar.className = 'btn';
        btnApagar.style.backgroundColor = '#d32f2f';
        btnApagar.onmouseover = () => btnApagar.style.backgroundColor = '#9a0007';
        btnApagar.onmouseout = () => btnApagar.style.backgroundColor = '#d32f2f';
        btnApagar.onclick = () => apagarDieta(index);

        actionsDiv.appendChild(btnEditar);
        actionsDiv.appendChild(btnApagar);

        li.appendChild(textoDiv);
        li.appendChild(actionsDiv);

        listaDietas.appendChild(li);
      });
    }

    function iniciarEdicao(index, li, textoDiv) {
      const dietas = JSON.parse(localStorage.getItem('dietas')) || [];
      const textoAtual = dietas[index];
      const textareaEdit = document.createElement('textarea');
      textareaEdit.className = 'edit-textarea';
      textareaEdit.value = textoAtual;

      const btnSalvar = document.createElement('button');
      btnSalvar.textContent = 'Salvar';
      btnSalvar.className = 'btn';
      btnSalvar.onclick = () => {
        const novoTexto = textareaEdit.value.trim();
        if (novoTexto) {
          dietas[index] = novoTexto;
          localStorage.setItem('dietas', JSON.stringify(dietas));
          carregarDietas();
        } else {
          alert('O texto da dieta não pode ficar vazio.');
        }
      };

      const btnCancelar = document.createElement('button');
      btnCancelar.textContent = 'Cancelar';
      btnCancelar.className = 'btn cancelar';
      btnCancelar.onclick = () => carregarDietas();

      li.innerHTML = '';
      li.appendChild(textareaEdit);

      const divBotoes = document.createElement('div');
      divBotoes.style.marginTop = '5px';
      divBotoes.appendChild(btnSalvar);
      divBotoes.appendChild(btnCancelar);

      li.appendChild(divBotoes);
    }

    function apagarDieta(index) {
      if (confirm('Tem certeza que deseja apagar esta dieta?')) {
        const dietas = JSON.parse(localStorage.getItem('dietas')) || [];
        dietas.splice(index, 1);
        localStorage.setItem('dietas', JSON.stringify(dietas));
        carregarDietas();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const texto = textarea.value.trim();
      if (texto) {
        const dietas = JSON.parse(localStorage.getItem('dietas')) || [];
        dietas.push(texto);
        localStorage.setItem('dietas', JSON.stringify(dietas));
        textarea.value = '';
        carregarDietas();
      }
    });

    carregarDietas();
  </script>
</body>
</html>
