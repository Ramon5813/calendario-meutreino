<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Treinos & Calendário</title>

  <!-- Fonte estilo HQ -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Bangers', cursive;
      background: linear-gradient(135deg, #ff4081, #651fff);
      margin: 0;
      padding: 0;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0px #000;
      color: #ffeb3b;
    }

    h2 {
      font-size: 2rem;
      margin-top: 30px;
      text-shadow: 2px 2px 0px #000;
      color: #00e676;
    }

    h3 {
      font-size: 1.5rem;
      margin-top: 15px;
      text-shadow: 2px 2px 0px #000;
      color: #ff9100;
    }

    /* MENU */
    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }

    .menu a {
      background: #00bcd4;
      padding: 12px 25px;
      text-decoration: none;
      color: #fff;
      border-radius: 12px;
      font-size: 1.2rem;
      transition: 0.3s;
      box-shadow: 3px 3px 0px #000;
    }

    .menu a:hover {
      background: #ff5722;
      transform: scale(1.1);
    }

    /* CHECKBOX TREINOS */
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      margin: 10px 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #ffeb3b;
    }

    /* CALENDÁRIO */
    #calendario {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 20px;
      box-shadow: 5px 5px 0px #000;
    }

    #mes-ano {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #ffeb3b;
      text-shadow: 2px 2px 0px #000;
    }

    #navegacao {
      margin-bottom: 15px;
    }

    #navegacao button {
      background: #ff4081;
      border: none;
      color: white;
      font-size: 1.2rem;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      margin: 0 8px;
      transition: 0.3s;
      box-shadow: 3px 3px 0px #000;
    }

    #navegacao button:hover {
      background: #651fff;
      transform: scale(1.1);
    }

    #dias-semana, #dias-mes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    #dias-semana div {
      font-weight: bold;
      color: #00e676;
      text-shadow: 1px 1px 0px #000;
    }

    .dia {
      background: #ff9100;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 2px 2px 0px #000;
      cursor: pointer;
      transition: 0.2s;
    }

    .dia:hover {
      background: #ff5722;
      transform: scale(1.05);
    }

    .hoje {
      background: #ffeb3b !important;
      color: #000;
    }

    .vazio {
      background: transparent;
      box-shadow: none;
      cursor: default;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 12px;
      text-align: center;
      font-size: 1rem;
      color: #ffeb3b;
      text-shadow: 1px 1px 0px #000;
    }

    /* RESPONSIVIDADE */
    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.2rem; }
      .menu a { font-size: 1rem; padding: 10px 18px; }
      #mes-ano { font-size: 1.5rem; }
      .dia { padding: 10px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Treinos & Calendário</h1>

    <!-- Menu -->
    <nav class="menu">
      <a href="#">Segunda</a>
      <a href="#">Terça</a>
      <a href="#">Quarta</a>
      <a href="#">Quinta</a>
      <a href="#">Sexta</a>
      <a href="#">Sábado</a>
      <a href="#">Domingo</a>
    </nav>

    <!-- Exemplos de treinos -->
    <h2>Treinos do Dia</h2>
    <label><input type="checkbox"> Flexões</label>
    <label><input type="checkbox"> Corrida</label>
    <label><input type="checkbox"> Prancha</label>
    <label><input type="checkbox"> Agachamento</label>

    <!-- Calendário -->
    <div id="calendario">
      <div id="mes-ano">Outubro 2025</div>
      <div id="navegacao">
        <button>&lt; Anterior</button>
        <button>Próximo &gt;</button>
      </div>
      <div id="dias-semana">
        <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div>
        <div>Qui</div><div>Sex</div><div>Sáb</div>
      </div>
      <div id="dias-mes">
        <div class="vazio"></div>
        <div class="dia">1</div>
        <div class="dia">2</div>
        <div class="dia hoje">3</div>
        <div class="dia">4</div>
        <div class="dia">5</div>
        <div class="dia">6</div>
      </div>
    </div>

    <footer>
      © 2025 - Seu projeto de treinos em estilo HQ!
    </footer>
  </div>

</body>
</html>
