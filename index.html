<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinos X-Men - Gamificação</title>

  <!-- Fonte HQ -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Calendário X-Men + Treinos</h1>
  <button id="btn-tema">🌗 Alternar Tema</button>

  <div id="gamificacao" class="container">Pontos: 0 | Medalha: Nenhuma</div>

  <div class="container" id="calendario">
    <div id="mes-ano"></div>
    <div id="dias-semana">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>
    <div id="dias-mes"></div>
    <div id="navegacao">
      <button id="btn-anterior">◀ Mês Anterior</button>
      <button id="btn-proximo">Mês Seguinte ▶</button>
    </div>
  </div>

  <div class="container menu-container">
    <h2>📅 Menu de Treinos</h2>
    <ul class="menu">
      <li><a href="segunda.html">Segunda</a></li>
      <li><a href="terca.html">Terça</a></li>
      <li><a href="quarta.html">Quarta</a></li>
      <li><a href="quinta.html">Quinta</a></li>
      <li><a href="sexta.html">Sexta</a></li>
      <li><a href="sabado-domingo.html" class="sabado-domingo">Sábado / Domingo</a></li>
      <li><a href="observacoes.html">Observações</a></li>
      <li><a href="dietas.html">Dietas</a></li>
    </ul>
  </div>

  <footer>✨ Treine como um X-Men! ✨</footer>

  <script>
    // ===== Service Worker =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registrado!', reg))
          .catch(err => console.log('Erro ao registrar SW:', err));
      });
    }

    // ===== Tema Claro/Escuro =====
    const btnTema = document.getElementById('btn-tema');
    btnTema.addEventListener('click', () => {
      document.body.classList.toggle('tema-claro');
      localStorage.setItem('tema', document.body.classList.contains('tema-claro') ? 'claro' : 'escuro');
    });
    if(localStorage.getItem('tema') === 'claro') document.body.classList.add('tema-claro');

    // ===== Gamificação =====
    const gamificacaoEl = document.getElementById('gamificacao');
    function atualizarGamificacao() {
      const chave = `diasMarcados-${mesAtual}-${anoAtual}`;
      const diasMarcados = JSON.parse(localStorage.getItem(chave)) || [];
      let pontos = diasMarcados.length;
      let medalha = '';
      if (pontos >= 20) medalha = '🏆 Mestre X-Men';
      else if (pontos >= 10) medalha = '🥇 Treinador X-Men';
      else if (pontos >= 5) medalha = '🥈 Aprendiz X-Men';
      gamificacaoEl.textContent = `Pontos: ${pontos} | Medalha: ${medalha || 'Nenhuma'}`;
    }

    // ===== Calendário =====
    const mesAnoEl = document.getElementById('mes-ano');
    const diasMesEl = document.getElementById('dias-mes');
    const btnAnterior = document.getElementById('btn-anterior');
    const btnProximo = document.getElementById('btn-proximo');

    let dataAtual = new Date();
    let mesAtual = dataAtual.getMonth();
    let anoAtual = dataAtual.getFullYear();

    function carregarCalendario(mes, ano) {
      mesAnoEl.textContent = `${obterNomeMes(mes)} ${ano}`;
      diasMesEl.innerHTML = '';

      const primeiraData = new Date(ano, mes, 1);
      const ultimoDia = new Date(ano, mes + 1, 0).getDate();
      const diaSemanaInicio = primeiraData.getDay();

      // Dias vazios
      for(let i=0;i<diaSemanaInicio;i++){
        const diaVazio = document.createElement('div');
        diaVazio.classList.add('dia','vazio');
        diasMesEl.appendChild(diaVazio);
      }

      const chaveStorage = `diasMarcados-${mes}-${ano}`;
      const dadosMarcados = JSON.parse(localStorage.getItem(chaveStorage)) || [];

      for(let dia=1; dia<=ultimoDia; dia++){
        const diaEl = document.createElement('div');
        diaEl.classList.add('dia');
        diaEl.textContent = dia;

        if(dadosMarcados.includes(dia)) diaEl.classList.add('marcado');
        if(dia===dataAtual.getDate() && mes===dataAtual.getMonth() && ano===dataAtual.getFullYear()) diaEl.classList.add('hoje');

        diaEl.addEventListener('click', ()=>{
          if(diaEl.classList.contains('marcado')){
            diaEl.classList.remove('marcado');
            removerDia(dia,chaveStorage);
          } else {
            diaEl.classList.add('marcado');
            adicionarDia(dia,chaveStorage);
          }
          atualizarGamificacao();
        });

        diasMesEl.appendChild(diaEl);
      }

      atualizarGamificacao();
    }

    function adicionarDia(dia,chave){
      let arr = JSON.parse(localStorage.getItem(chave)) || [];
      if(!arr.includes(dia)) arr.push(dia);
      localStorage.setItem(chave,JSON.stringify(arr));
    }

    function removerDia(dia,chave){
      let arr = JSON.parse(localStorage.getItem(chave)) || [];
      arr = arr.filter(d=>d!==dia);
      localStorage.setItem(chave,JSON.stringify(arr));
    }

    function obterNomeMes(mes){
      return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes];
    }

    btnAnterior.addEventListener('click',()=>{
      mesAtual--;
      if(mesAtual<0){ mesAtual=11; anoAtual--; }
      carregarCalendario(mesAtual,anoAtual);
    });

    btnProximo.addEventListener('click',()=>{
      mesAtual++;
      if(mesAtual>11){ mesAtual=0; anoAtual++; }
      carregarCalendario(mesAtual,anoAtual);
    });

    carregarCalendario(mesAtual,anoAtual);

    // ===== Notificações =====
    function notificar(texto){
      if(Notification.permission==='granted'){
        new Notification(texto);
      } else if(Notification.permission!=='denied'){
        Notification.requestPermission().then(p=>{
          if(p==='granted') new Notification(texto);
        });
      }
    }
    setTimeout(()=>notificar("💪 Hora do treino X-Men!"),5000);

  </script>

</body>
</html>
