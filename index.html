<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendário + Menu de Treinos - X-Men</title>
  
  <!-- Fonte estilo HQ -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    /* RESET e corpo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-image: url('xmen-bg.jpg'); /* Coloque a imagem dos X-Men na mesma pasta */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Título estilo HQ */
    h1 {
      font-family: 'Bangers', sans-serif;
      font-size: 2.5em;
      text-align: center;
      text-shadow: 3px 3px 6px #000;
      color: #ffdd00;
      margin-bottom: 30px;
    }

    /* Calendário */
    #calendario {
      max-width: 360px;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      padding: 20px;
      margin-bottom: 40px;
      user-select: none;
    }

    #mes-ano {
      text-align: center;
      font-size: 1.6em;
      margin-bottom: 12px;
      color: #ffdd00;
      text-shadow: 2px 2px 4px #000;
      font-family: 'Bangers', sans-serif;
    }

    #dias-semana {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      font-weight: bold;
      color: #ff4444;
      margin-bottom: 5px;
    }

    #dias-semana div {
      text-align: center;
      padding: 5px 0;
      font-family: 'Bangers', sans-serif;
    }

    #dias-mes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .dia {
      background: rgba(255,255,255,0.15);
      padding: 12px 0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-family: 'Bangers', sans-serif;
      transition: all 0.3s ease;
      position: relative;
      user-select: none;
    }

    .dia:hover {
      background: rgba(255,255,255,0.35);
      color: #ffdd00;
      transform: scale(1.08);
    }

    .dia.marcado {
      background: #ffdd00;
      color: #000;
      font-weight: bold;
    }

    .dia.hoje {
      border: 2px solid #ff4444;
    }

    .dia.vazio {
      background: transparent;
      cursor: default;
    }

    /* Navegação */
    #navegacao {
      text-align: center;
      margin-top: 15px;
    }

    #navegacao button {
      background: #ff4444;
      border: none;
      color: #fff;
      padding: 10px 18px;
      margin: 0 10px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Bangers', sans-serif;
    }

    #navegacao button:hover {
      background: #cc0000;
      transform: scale(1.1);
    }

    /* Menu de treinos */
    .menu-container {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .menu-container h2 {
      margin-bottom: 20px;
      font-family: 'Bangers', sans-serif;
      font-size: 1.8em;
      color: #ffdd00;
      text-shadow: 2px 2px 5px #000;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu li {
      margin: 12px 0;
    }

    .menu a {
      display: inline-block;
      padding: 15px 28px;
      background-color: #ff4444;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.3em;
      font-weight: bold;
      transition: all 0.3s ease;
      font-family: 'Bangers', sans-serif;
    }

    .menu a:hover {
      background-color: #cc0000;
      transform: scale(1.08);
    }

    .menu a.sabado-domingo {
      background-color: #4444ff;
      color: #ffdd00;
    }

    /* Footer */
    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 1.1em;
      color: #ffdd00;
      text-shadow: 2px 2px 5px #000;
      font-family: 'Bangers', sans-serif;
    }

    @media(max-width: 400px){
      .menu a, #navegacao button {
        padding: 12px 18px;
        font-size: 1em;
      }
      h1 { font-size: 2em; }
      .menu-container h2 { font-size: 1.5em; }
    }
  </style>
</head>

<body>

  <h1>Calendário Checklist + Treinos Semanais</h1>

  <div id="calendario">
    <div id="mes-ano"></div>
    <div id="dias-semana">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>
    <div id="dias-mes"></div>
    <div id="navegacao">
      <button id="btn-anterior">◀ Mês Anterior</button>
      <button id="btn-proximo">Mês Seguinte ▶</button>
    </div>
  </div>

  <div class="menu-container">
    <h2>📅 Meu Treino da Semana</h2>
    <ul class="menu">
      <li><a href="segunda.html">Segunda</a></li>
      <li><a href="terca.html">Terça</a></li>
      <li><a href="quarta.html">Quarta</a></li>
      <li><a href="quinta.html">Quinta</a></li>
      <li><a href="sexta.html">Sexta</a></li>
      <li><a href="sabado-domingo.html" class="sabado-domingo">Sábado / Domingo</a></li>
      <li><a href="observacoes.html">Observações</a></li>
      <li><a href="dietas.html">Dietas</a></li>
    </ul>
  </div>

  <footer>✨ Treine como um X-Men! ✨</footer>

  <script>
    const mesAnoEl = document.getElementById('mes-ano');
    const diasMesEl = document.getElementById('dias-mes');
    const btnAnterior = document.getElementById('btn-anterior');
    const btnProximo = document.getElementById('btn-proximo');

    let dataAtual = new Date();
    let mesAtual = dataAtual.getMonth();
    let anoAtual = dataAtual.getFullYear();

    function carregarCalendario(mes, ano) {
      mesAnoEl.textContent = `${obterNomeMes(mes)} ${ano}`;
      diasMesEl.innerHTML = '';

      const primeiraData = new Date(ano, mes, 1);
      const ultimoDia = new Date(ano, mes + 1, 0).getDate();
      const diaSemanaInicio = primeiraData.getDay();

      for (let i = 0; i < diaSemanaInicio; i++) {
        const diaVazio = document.createElement('div');
        diaVazio.classList.add('dia', 'vazio');
        diasMesEl.appendChild(diaVazio);
      }

      const chaveStorage = `diasMarcados-${ano}-${mes}`;
      const dadosMarcados = JSON.parse(localStorage.getItem(chaveStorage)) || [];

      for (let dia = 1; dia <= ultimoDia; dia++) {
        const diaEl = document.createElement('div');
        diaEl.classList.add('dia');
        diaEl.textContent = dia;

        if (dadosMarcados.includes(dia)) {
          diaEl.classList.add('marcado');
        }

        if (
          dia === dataAtual.getDate() &&
          mes === dataAtual.getMonth() &&
          ano === dataAtual.getFullYear()
        ) {
          diaEl.classList.add('hoje');
        }

        diaEl.addEventListener('click', () => {
          if (diaEl.classList.contains('marcado')) {
            diaEl.classList.remove('marcado');
            removerDia(dia, chaveStorage);
          } else {
            diaEl.classList.add('marcado');
            adicionarDia(dia, chaveStorage);
          }
        });

        diasMesEl.appendChild(diaEl);
      }
    }

    function adicionarDia(dia, chave) {
      let arr = JSON.parse(localStorage.getItem(chave)) || [];
      if (!arr.includes(dia)) {
        arr.push(dia);
        localStorage.setItem(chave, JSON.stringify(arr));
      }
    }

    function removerDia(dia, chave) {
      let arr = JSON.parse(localStorage.getItem(chave)) || [];
      arr = arr.filter(d => d !== dia);
      localStorage.setItem(chave, JSON.stringify(arr));
    }

    function obterNomeMes(mes) {
      const nomes = [
        'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
      ];
      return nomes[mes];
    }

    btnAnterior.addEventListener('click', () => {
      mesAtual--;
      if (mesAtual < 0) {
        mesAtual = 11;
        anoAtual--;
      }
      carregarCalendario(mesAtual, anoAtual);
    });

    btnProximo.addEventListener('click', () => {
      mesAtual++;
      if (mesAtual > 11) {
        mesAtual = 0;
        anoAtual++;
      }
      carregarCalendario(mesAtual, anoAtual);
    });

    carregarCalendario(mesAtual, anoAtual);
  </script>

</body>
</html>
