<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Treino - Quinta-feira</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fffde7;
    }
    h1 {
      color: #fbc02d;
    }
    h2 {
      color: #f9a825;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 10px;
    }
    label {
      font-size: 1.1em;
    }
    .section {
      margin-top: 30px;
    }
    .back-link {
      margin-top: 40px;
      display: block;
    }
  </style>
</head>
<body>

  <h1>🟨 Quinta – HIIT (Esteira) + CORE Intenso</h1>

  <div class="section">
    <h2>HIIT na esteira (~30 min)</h2>
    <ul>
      <li><input type="checkbox" id="hiit1"> <label for="hiit1">5 min aquecimento</label></li>
      <li><input type="checkbox" id="hiit2"> <label for="hiit2">10 ciclos de: 1 min corrida forte + 1 min caminhada leve</label></li>
      <li><input type="checkbox" id="hiit3"> <label for="hiit3">5 min desaquecimento</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>CORE Intenso</h2>
    <ul>
      <li><input type="checkbox" id="core1"> <label for="core1">Prancha frontal com elevação alternada – 3x12</label></li>
      <li><input type="checkbox" id="core2"> <label for="core2">Abdominal canivete – 3x15</label></li>
      <li><input type="checkbox" id="core3"> <label for="core3">Abdominal com bola – 3x20</label></li>
      <li><input type="checkbox" id="core4"> <label for="core4">Prancha lateral com rotação – 2x cada lado</label></li>
    </ul>
  </div>
