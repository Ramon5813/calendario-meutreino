<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Segunda - Treino</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fdecea; /* vermelho claro suave */
    }
    h1 {
      color: #b71c1c; /* vermelho escuro para combinar */
    }
    h2 {
      color: #d32f2f; /* tom intermediário */
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 10px;
    }
    label {
      font-size: 1.1em;
    }
    .section {
      margin-top: 30px;
    }
    .back-link {
      margin-top: 40px;
      display: block;
      color: #b71c1c;
      text-decoration: none;
      font-weight: bold;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🟥 Segunda – Peito + Tríceps + Abdômen + Cardio</h1>

    <div class="section">
      <h2>Peito e Tríceps</h2>
      <ul>
        <li><input type="checkbox" id="ex1" /> <label for="ex1">Supino reto com barra – 4x12</label></li>
        <li><input type="checkbox" id="ex2" /> <label for="ex2">Supino inclinado com halteres – 3x12</label></li>
        <li><input type="checkbox" id="ex3" /> <label for="ex3">Crucifixo reto – 3x15</label></li>
        <li><input type="checkbox" id="ex4" /> <label for="ex4">Tríceps pulley com corda – 3x12</label></li>
        <li><input type="checkbox" id="ex5" /> <label for="ex5">Tríceps testa com barra – 3x10</label></li>
      </ul>
    </div>

    <div class="section">
      <h2>Abdômen + Cardio</h2>
      <ul>
        <li><input type="checkbox" id="ab1" /> <label for="ab1">Elevação de pernas – 3x15</label></li>
        <li><input type="checkbox" id="ab2" /> <label for="ab2">Prancha – 3x 1 min</label></li>
        <li><input type="checkbox" id="ab3" /> <label for="ab3">Esteira: 20 min moderado</label></li>
      </ul>
    </div>

    <a href="index.html" class="back-link">⬅ Voltar para o Início</a>
  </div>
</body>
</html>
