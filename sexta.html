<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Treino - Sexta-feira</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f3e5f5;
    }
    h1 {
      color: #8e24aa;
    }
    h2 {
      color: #7b1fa2;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 10px;
    }
    label {
      font-size: 1.1em;
    }
    .section {
      margin-top: 30px;
    }
    .back-link {
      margin-top: 40px;
      display: block;
    }
  </style>
</head>
<body>

  <h1>🟪 Sexta – Ombros + Abdômen + Cardio</h1>

  <div class="section">
    <h2>Ombros</h2>
    <ul>
      <li><input type="checkbox" id="ombro1"> <label for="ombro1">Elevação lateral – 3x12</label></li>
      <li><input type="checkbox" id="ombro2"> <label for="ombro2">Desenvolvimento com halteres – 3x12</label></li>
      <li><input type="checkbox" id="ombro3"> <label for="ombro3">Elevação frontal com barra – 3x12</label></li>
      <li><input type="checkbox" id="ombro4"> <label for="ombro4">Encolhimento de ombros – 3x20</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>Abdômen</h2>
    <ul>
      <li><input type="checkbox" id="abdomen1"> <label for="abdomen1">Abdominal inferior na barra (pernas suspensas) – 3x15</label></li>
      <li><input type="checkbox" id="abdomen2"> <label for="abdomen2">Russian twist com anilha – 3x30</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>Cardio</h2>
    <ul>
      <li><input type="checkbox" id="cardio1"> <label for="cardio1">Esteira: 20-25 min leve ou moderado (pós treino)</label></li>
    </ul>
  </div>

  <a class="back-link" href="index.html">⬅ Voltar para o Início</a>

</body>
</html>
