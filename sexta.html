<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Treino - Sexta-feira</title>

  <!-- Fonte estilo HQ -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    /* ===== Corpo da página ===== */
    body {
      font-family: 'Bangers', sans-serif;
      background-image: url('xmen-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #e1bee7;
    }

    /* ===== Container principal ===== */
    .container {
      max-width: 600px;
      width: 100%;
      padding: 20px;
      background: rgba(0,0,0,0.8);
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    }

    /* ===== Títulos ===== */
    h1 {
      text-align: center;
      color: #e1bee7;
      text-shadow: 3px 3px 6px black;
      margin-bottom: 25px;
      font-size: 2em;
    }

    h2 {
      color: #e1bee7;
      text-shadow: 2px 2px 4px black;
      margin-top: 25px;
      margin-bottom: 15px;
      font-size: 1.5em;
    }

    /* ===== Listas e checkboxes ===== */
    ul {
      list-style: none;
      padding-left: 0;
    }

    li {
      background: rgba(255,255,255,0.15);
      color: #fff;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    li:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.03);
    }

    input[type="checkbox"] {
      margin-right: 12px;
      transform: scale(1.3);
      accent-color: #e1bee7;
      cursor: pointer;
    }

    label {
      font-size: 1.2em;
      cursor: pointer;
    }

    /* ===== Link voltar ===== */
    .back-link {
      display: inline-block;
      margin-top: 25px;
      text-decoration: none;
      color: #e1bee7;
      font-weight: bold;
      text-shadow: 2px 2px 5px black;
      font-size: 1.2em;
      transition: transform 0.2s ease;
    }

    .back-link:hover {
      text-decoration: underline;
      transform: scale(1.05);
    }

    /* ===== Responsividade ===== */
    @media(max-width: 400px) {
      h1 { font-size: 1.5em; }
      h2 { font-size: 1.2em; }
      li { font-size: 1em; padding: 10px; }
      input[type="checkbox"] { transform: scale(1.1); }
      .back-link { font-size: 1em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🟪 Sexta – Ombros + Abdômen + Cardio</h1>

    <div class="section">
      <h2>Ombros</h2>
      <ul>
        <li><input type="checkbox" id="ombro1"> <label for="ombro1">Elevação lateral – 3x12</label></li>
        <li><input type="checkbox" id="ombro2"> <label for="ombro2">Desenvolvimento com halteres – 3x12</label></li>
        <li><input type="checkbox" id="ombro3"> <label for="ombro3">Elevação frontal com barra – 3x12</label></li>
        <li><input type="checkbox" id="ombro4"> <label for="ombro4">Encolhimento de ombros – 3x20</label></li>
      </ul>
    </div>

    <div class="section">
      <h2>Abdômen</h2>
      <ul>
        <li><input type="checkbox" id="abdomen1"> <label for="abdomen1">Abdominal inferior na barra (pernas suspensas) – 3x15</label></li>
        <li><input type="checkbox" id="abdomen2"> <label for="abdomen2">Russian twist com anilha – 3x30</label></li>
      </ul>
    </div>

    <div class="section">
      <h2>Cardio</h2>
      <ul>
        <li><input type="checkbox" id="cardio1"> <label for="cardio1">Esteira: 20-25 min leve ou moderado (pós treino)</label></li>
      </ul>
    </div>

    <a class="back-link" href="index.html">⬅ Voltar para o Início</a>
  </div>
</body>
</html>
